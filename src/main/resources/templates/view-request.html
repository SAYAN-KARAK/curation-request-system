<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Request</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 th:text="${request.title}"></h2>

        <hr>

        <p>
            <strong>Description:</strong>
            <span th:text="${request.description}"></span>
        </p>

        <p>
            <strong>Category:</strong>
            <span th:text="${request.category}"></span>
        </p>

        <p>
            <strong>Priority:</strong>
            <span th:text="${request.priority}"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span th:text="${request.status}"></span>
        </p>

        <p>
            <strong>Requested By:</strong>
            <span th:text="${request.requestedBy}"></span>
        </p>

        <a href="/" class="btn btn-secondary">
            Back
        </a>

    </div>

</div>

</body>
</html>
